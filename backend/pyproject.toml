[project]
name = "department-ai-python"
version = "0.1.0"
description = "部门 AI 的 Python 业务后端"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi==25.1.0",
  "httpx>=0.28,<1",
  "websockets>=14,<16",
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
