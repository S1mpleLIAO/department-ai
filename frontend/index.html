    </form>
  </dialog>

      <div class="confirm-mark" aria-hidden="true">!</div>
      <div class="confirm-copy"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><small id="confirm-detail" hidden></small></div>
      <footer><button class="button" value="cancel">取消</button><button class="button danger solid" value="confirm">确认删除</button></footer>
    </form>
  </dialog>
